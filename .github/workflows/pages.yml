name: Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ref:
    name: refuse a ref that is not a v* tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check the ref
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "deploying from $GITHUB_REF"
              ;;
            *)
              echo "::error::pages.yml deploys only from a v* tag, not from $GITHUB_REF; dispatch it with gh workflow run pages.yml --ref <tag>"
              exit 1
              ;;
          esac

  deploy:
    name: assemble and deploy every published version
    needs: ref
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      - name: Pages address
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch the Releases API and the web assets of every published release
        run: |
          set -euo pipefail
          mkdir -p in/assets in/live
          page=1
          while :; do
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "in/releases-$page.json" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page"
            if [ "$(jq length "in/releases-$page.json")" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done
          args=()
          for file in in/releases-*.json; do
            args+=(--releases "$file")
          done
          node web/scripts/assemble_pages.mjs plan "${args[@]}" --out in/downloads.tsv
          while IFS=$'\t' read -r version name url; do
            mkdir -p "in/assets/$version"
            curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "in/assets/$version/$name" "$url"
          done < in/downloads.tsv

      - name: Read the live versions.json and the BUILD.json of every live version
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          code="$(curl -sS --retry 3 -o in/live/versions.json -w '%{http_code}' "$base/versions.json")"
          echo "$code" > in/live/versions.status
          echo "live $base/versions.json: HTTP $code"
          if [ "$code" = "200" ]; then
            node web/scripts/assemble_pages.mjs live-list --versions in/live/versions.json > in/live/list.txt
            while read -r version; do
              mkdir -p "in/live/v$version"
              curl -sS --retry 3 -o "in/live/v$version/BUILD.json" -w '%{http_code}' "$base/v$version/BUILD.json" > "in/live/v$version/BUILD.json.status"
              echo "live v$version/BUILD.json: HTTP $(cat "in/live/v$version/BUILD.json.status")"
            done < in/live/list.txt
          fi

      - name: Assemble the site (verify every zip, keep every live version, pick latest)
        run: |
          set -euo pipefail
          args=()
          for file in in/releases-*.json; do
            args+=(--releases "$file")
          done
          node web/scripts/assemble_pages.mjs assemble "${args[@]}" --assets in/assets --live in/live --known web/releases.json \
            --event "$GITHUB_EVENT_NAME" --run-attempt "$GITHUB_RUN_ATTEMPT" --ref "$GITHUB_REF" --out _site --summary "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
