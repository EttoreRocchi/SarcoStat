# Minimal Run - for quick tests with limited resources
# Covers essential parameter space with reduced combinations
n_simulations: 5000
seed: 42
n_processes: 4

n_sarcomeres: [5, 10, 25, 50, 100]
kappa_values: [0, 1, 5, 10, 50]

length_distribution: 'truncnorm'
length_mean: 1.0
length_std: 0.25
length_min: 0.1
length_max: 2.0

angular_distribution: 'vonmises'
angular_mean: 0.0
angular_correlation: 0.0

enable_persistence: false
enable_curvature_bias: false

output_dir: 'paper/results/minimal'
save_raw_data: true
save_figures: true
figure_dpi: 300
