# Single Sarcomere Simulation Configuration
# Configuration for Monte Carlo validation of single sarcomere morphometry.
# Reference: Cisterna et al. (2021) CMPB 211:106437

n_simulations: 1000        # Sarcomeres per condition
seed: 42                   # Random seed for reproducibility

# Choose: 'euploid' or 'trisomic'
target_condition: 'euploid'

# Cisterna et al. (2021) reference values (mean, std in nm)
cisterna_parameters:
  euploid:
    z_length: [414, 109]           # Z-line length: 414 +/- 109 nm
    sarcomere_length: [1638, 114]  # MN distance: 1638 +/- 114 nm
    m_line_length: [469, 118]      # M-line length: 469 +/- 118 nm
  trisomic:
    z_length: [350, 108]           # Z-line length: 350 +/- 108 nm
    sarcomere_length: [1281, 89]   # MN distance: 1281 +/- 89 nm
    m_line_length: [478, 123]      # M-line length: 478 +/- 123 nm

noise_sensitivity:
  enabled: true
  # Noise levels to test (standard deviation in nm)
  # Typical annotation precision: 5-20 nm for manual clicking
  noise_levels: [0, 5, 10, 15, 20, 30, 50, 75, 100]
  noise_model: 'isotropic'  # 'isotropic' or 'anisotropic'
  n_replicates: 100         # Noise samples per sarcomere

  # Anisotropic noise shape (if noise_model='anisotropic'): relative weights
  # along / perpendicular to the sarcomere axis. The overall scale follows
  # each noise level, with the same total variance as the isotropic model.
  anisotropic:
    along_weight: 1
    perpendicular_weight: 2

# Tests classification robustness when Cur ~ AsR (boundary region)
boundary_analysis:
  enabled: true
  tolerance: 0.05              # Cur within 5% of AsR = "boundary"
  n_boundary_samples: 500      # Samples per (offset, noise) combination
  offset_range: [-0.3, 0.3]    # Cur - AsR range to test

output_dir: 'outputs/sarcomere_simulation'
save_raw_data: false           # Save per-replicate error arrays (.npz, ~20 MB at defaults)
save_figures: true             # Generate and save figures
figure_dpi: 300                # Figure resolution for publication
