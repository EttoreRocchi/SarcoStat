[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sarcostat"
description = "Sarcomeric sequence analysis with circular statistics and morphometry"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "sarcomere",
    "myofibril",
    "circular statistics",
    "morphometry",
    "image analysis",
    "biomedicine",
    "muscle analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
sarcostat = "sarcostat.cli._entry:main"

[project.urls]
Homepage = "https://github.com/EttoreRocchi/SarcoStat"
Repository = "https://github.com/EttoreRocchi/SarcoStat"
Issues = "https://github.com/EttoreRocchi/SarcoStat/issues"
Changelog = "https://github.com/EttoreRocchi/SarcoStat/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "sarcostat.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
cli = {file = ["requirements-cli.txt"]}
sim = {file = ["requirements-cli.txt", "requirements-sim.txt"]}
dev = {file = ["requirements-dev.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sarcostat*"]

[tool.setuptools.package-data]
sarcostat = ["py.typed"]
"sarcostat.simulation" = ["*.yaml"]
"sarcostat.gui" = ["*.png"]
"sarcostat.io" = ["*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]
extend-exclude = [
    "outputs",
    "paper",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "B008",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = ["src/sarcostat/gui/"]

[[tool.mypy.overrides]]
module = ["sarcostat.gui", "sarcostat.gui.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "needs_cpython: needs CPython-only facilities; deselected in the Pyodide test run",
    "needs_sim: needs the [sim] extra (pandas, matplotlib, seaborn, pyyaml)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
